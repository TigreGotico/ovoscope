[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovoscope"
dynamic = ["version"]
description = "End-to-end test framework for OpenVoiceOS skills"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAI", email = "jarbasai@mailfence.com"},
]
requires-python = ">=3.10"
dependencies = [
    # Alpha pin: 2.0.4 stable not yet released; 2.6.2a1 is the minimum that
    # includes the FakeBus-compatible SkillManager changes ovoscope depends on.
    # [plugins] extra: bare ovos-core ships no pipeline matchers at all.
    # Padatious, Adapt and Padacioso all live in [plugins] from 2.6.2a1
    # onward, per PyPI metadata, which is why the floor sits there — an
    # earlier floor can resolve to a release where Padatious is in neither
    # extra, leaving every Padatious-registered intent silently unmatched.
    "ovos-core[plugins]>=2.6.2a1",
    # The audio harness emits/observes the ovos.* spec topics while ovos-audio
    # still produces the legacy topics. >=0.12.0a1 is the first FakeBus that
    # mirrors MessageBusClient's legacy<->ovos.* namespace migration (ovos-utils
    # #381), so a legacy producer reaches a spec listener (and vice-versa) on the
    # test double. Prerelease floor pin: resolves without --pre.
    "ovos-utils>=0.12.0a1",
    # anonymize_message() uses Session.location with OVOS-SESSION-1 §3.5 spec
    # shape ({lat, lon, tz}); >=2.11.3a1 is the first release where the spec
    # shape is the canonical location field (location_preferences is deprecated).
    "ovos-bus-client>=2.11.3a1",
    # both_spellings() resolves a migrating topic's counterpart from the
    # migration map, so a source/destination rule written for one spelling
    # holds under the other. ovos-bus-client already requires this package;
    # naming it here makes the import honest rather than transitive. The floor
    # is the first release carrying the OVOS-FALLBACK-1 renames, without which
    # the default keep-src topics expand to themselves and the rule is vacuous.
    "ovos-spec-tools>=1.12.0a1",
    # ovoscope ships a pytest plugin (pytest11 entry point) -> pytest is a runtime
    # dependency. >=8 is required: the pytest_pycollect_makemodule hook dropped the
    # 'path' argument in pytest 8.
    "pytest>=8",
    # coverage.py validates pyproject.toml manifests; stdlib tomllib only
    # exists on 3.11+, so 3.10 needs the backport for the same honesty.
    "tomli>=2; python_version<'3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
pydantic = ["ovos-pydantic-models>=0.1.0"]
# The audio harness emits/asserts on the OVOS spec bus namespace via SpecMessage,
# and the FakeBus bridging (ovos-utils) imports NamespaceTranslator — new in
# ovos-spec-tools 0.10.0a1, so that is the real floor.
audio = ["ovos-audio>=1.3.0a1", "ovos-spec-tools>=0.10.0a1"]
# OCP / ovos-media player harnesses (ovoscope.media: OCPPlayerHarness, ...).
# 2.0.0a9 floor: the harness targets the restructured daemon layout
# (media_backends.audio.AudioService/BaseMediaService signatures, no in-core
# GUI); older ovos-media has a different module layout the harness never
# supported in practice.
media = ["ovos-media>=2.0.0a9"]
# MiniListener plugin_instances path (feed_audio_stream) needs the dinkum
# AudioTransformersService. >=0.7.2a1 is the first release that allows
# ovos-bus-client 2.x (older pins cap it <2.0.0 and conflict with ovos-core).
listener = ["ovos-dinkum-listener>=0.7.2a1"]
# Per-clip WakeWordProbe (ovoscope.wakeword_probe): streams audio arrays through
# a real HotWordEngine. Only needs numpy — the engine itself is environmental.
bench = ["numpy"]
# Multi-engine golden-utterance runner (ovoscope.golden): template engines
# plus the Model2Vec zero-shot prototype pipeline, scored standalone against
# a skill's own resource files (no bus/MiniCroft boot required). Padatious
# and padacioso already ship with ovos-core[lgpl,plugins]; nebulento and
# ovos-m2v-pipeline do not, so they are listed explicitly here.
engines = [
    "nebulento",
    "ovos-m2v-pipeline",
    "ovos-spec-tools>=1.9.1a1",
]
# End-to-end TTS intelligibility scoring (WER/CER round-trip via reference STT).
# faster-whisper itself is pulled by the plugin — don't list it here to avoid
# version skew.
tts = [
    "ovos-audio>=1.3.0a1",
    "jiwer",
    "ovos-utterance-normalizer",
    "ovos-stt-plugin-fasterwhisper",
]
# Every dependency test/unittests/ actually imports, in one extra, so
# `pip install '.[test]'` (what the docs/reviews assume exists, and what
# CI's coverage/build-tests workflows install) is enough to collect and
# run the full suite with nothing skipped for a missing optional dep.
test = [
    "ovos-audio>=1.3.0a1",
    "ovos-media>=2.0.0a9",
    "ovos-dinkum-listener>=0.7.2a1",
    "ovos-pydantic-models>=0.1.0",
    "numpy",
    "jiwer",
    "ovos-utterance-normalizer",
    "ovos-stt-plugin-fasterwhisper",
    "pytest-cov",
    "nebulento",
    "ovos-m2v-pipeline",
    "ovos-spec-tools>=1.9.1a1",
]
dev = ["ovoscope[test]"]

[project.scripts]
ovoscope = "ovoscope.cli:main"
ovoscope-setup = "ovoscope.setup_skill:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/ovoscope"
Documentation = "https://github.com/TigreGotico/ovoscope/tree/master/docs"
"Issue Tracker" = "https://github.com/TigreGotico/ovoscope/issues"

[project.entry-points."pytest11"]
ovoscope = "ovoscope.pytest_plugin"

[tool.setuptools.dynamic]
version = {attr = "ovoscope.version.__version__"}

[tool.setuptools.package-data]
ovoscope = ["skill_data/*", "*.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
timeout = 60

[tool.coverage.run]
relative_files = true
